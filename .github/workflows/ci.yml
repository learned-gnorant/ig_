name: CI

on:
  push:
  pull_request:

jobs:
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de blocker.js
        working-directory: tools/js-tests
        run: |
          npm install --no-audit --no-fund
          npm test

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Xcode
        run: xcodebuild -version
      - name: Compilar para el simulador (sin firmar)
        run: |
          xcodebuild build \
            -project ReelsBlocker.xcodeproj \
            -scheme ReelsBlocker \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
